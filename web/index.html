<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f2ec" />
    <title>Not It — somebody has to do it</title>
    <meta
      name="description"
      content="Not It ($NOTIT): a volunteer's-dilemma token on NEAR testnet. Somebody has to do it. If nobody does, everybody pays the last person who did. Test tokens, no value."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Set the theme before first paint so there is no flash.
      (function () {
        try {
          var t = localStorage.getItem('notit-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Not It needs JavaScript: the demo runs the game rules in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
