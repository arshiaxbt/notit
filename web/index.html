<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffd60a" />
    <title>Not It — somebody has to do it</title>
    <meta
      name="description"
      content="Not It ($NOTIT): a volunteer's-dilemma token on NEAR testnet. Somebody has to do it. If nobody does, everybody pays the last person who did. Test tokens, no value."
    />
    <link rel="canonical" href="https://arshiaxbt.github.io/notit/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Not It" />
    <meta property="og:title" content="Not It — somebody has to do it" />
    <meta property="og:description" content="If nobody does, everybody pays the last person who did. A volunteer's-dilemma token on NEAR testnet. Test tokens, no value." />
    <meta property="og:url" content="https://arshiaxbt.github.io/notit/" />
    <meta property="og:image" content="https://arshiaxbt.github.io/notit/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A ring of plain faces all looking away from a clock in the middle; one dark face in the centre looks at you." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@0xarshia" />
    <meta name="twitter:title" content="Not It — somebody has to do it" />
    <meta name="twitter:description" content="If nobody does, everybody pays the last person who did. A volunteer's-dilemma token on NEAR testnet. Test tokens, no value." />
    <meta name="twitter:image" content="https://arshiaxbt.github.io/notit/og.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      /* First paint, before the script or the stylesheet arrive: the page colour, the name and the yellow stage. */
      html { background: #f4f2ec; }
      html[data-theme='dark'] { background: #14120d; }
      body { margin: 0; }
      .boot { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #16130c; }
      html[data-theme='dark'] .boot__top { color: #fff4d6; }
      .boot__top { box-sizing: border-box; height: 97px; padding: 27px 16px 0; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 800; }
      .boot__stage { box-sizing: border-box; height: clamp(480px, calc(100svh - 182px), 760px); padding: 14px; background: #ffd60a; font-size: 1.2rem; font-weight: 700; text-align: center; }
      .boot__stage p { margin: 0 0 12px; }
      @media (max-width: 619px) {
        .boot__top { height: 123px; }
        .boot__stage { height: clamp(440px, calc(100svh - 123px), 720px); font-size: 1rem; }
      }
    </style>
    <script>
      // Set the theme before first paint so there is no flash.
      (function () {
        try {
          var t = localStorage.getItem('notit-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot__top">Not it!</div>
        <div class="boot__stage">
          <p>Somebody has to do it. If nobody does, everybody pays the last person who did.</p>
          <noscript><p>This page needs JavaScript: the game runs in your browser.</p></noscript>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
