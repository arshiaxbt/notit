<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffd60a" />
    <title>Not It — somebody has to do it</title>
    <meta
      name="description"
      content="Not It ($NOTIT): a volunteer's-dilemma token on NEAR testnet. Somebody has to do it. If nobody does, everybody pays the last person who did. Test tokens, no value."
    />
    <link rel="canonical" href="https://arshiaxbt.github.io/notit/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Not It" />
    <meta property="og:title" content="Not It — somebody has to do it" />
    <meta property="og:description" content="If nobody does, everybody pays the last person who did. A volunteer's-dilemma token on NEAR testnet. Test tokens, no value." />
    <meta property="og:url" content="https://arshiaxbt.github.io/notit/" />
    <meta property="og:image" content="https://arshiaxbt.github.io/notit/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A ring of plain faces all looking away from a clock in the middle; one dark face in the centre looks at you." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@0xarshia" />
    <meta name="twitter:title" content="Not It — somebody has to do it" />
    <meta name="twitter:description" content="If nobody does, everybody pays the last person who did. A volunteer's-dilemma token on NEAR testnet. Test tokens, no value." />
    <meta name="twitter:image" content="https://arshiaxbt.github.io/notit/og.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      /* First paint, before the script or the stylesheet arrive. The static shell below uses the
         app's own class names, so the real header and stage replace it without anything moving. */
      html { background: #f4f2ec; color: #16130c; }
      html[data-theme='dark'] { background: #14120d; color: #fff4d6; }
      body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .ribbon { margin: 0; padding: 5px 12px; min-height: 17px; background: #16130c; color: #fff4d6; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.09em; line-height: 17px; text-align: center; text-transform: uppercase; }
      .top__bar.boot-bar { box-sizing: border-box; max-width: 1180px; min-height: 70px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; }
      .logo { display: inline-flex; align-items: center; gap: 8px; font-size: 1.6rem; font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
      .logo__it { padding: 4px 8px; background: #ffd60a; color: #16130c; border: 3px solid #16130c; border-radius: 12px; transform: rotate(-5deg); }
      .stage { position: relative; height: clamp(360px, calc(100svh - 97px - 85px), 760px); background: #ffd60a; color: #16130c; }
      .stage__pitch { margin: 0; padding: 14px 14px 0; font-size: 1.2rem; font-weight: 700; line-height: 1.25; text-align: center; }
      .boot-note { margin: 12px 0 0; text-align: center; font-weight: 600; }
      @media (max-width: 760px) {
        .top__bar.boot-bar { min-height: 102px; align-items: flex-start; align-content: flex-start; padding-top: 11px; }
      }
      @media (max-width: 619px) {
        .stage { height: clamp(380px, calc(100svh - 127px), 720px); }
        .stage__pitch { font-size: 1rem; }
      }
    </style>
    <script>
      // Set the theme before first paint so there is no flash.
      (function () {
        try {
          var t = localStorage.getItem('notit-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="app">
        <header class="top">
          <p class="ribbon"><span>no value</span></p>
          <div class="top__bar boot-bar">
            <span class="logo" aria-label="Not It"><span class="logo__not" aria-hidden="true">Not</span><span class="logo__it" aria-hidden="true">it!</span></span>
          </div>
        </header>
        <main class="main main--bleed">
          <section class="stage">
            <h1 class="stage__pitch">Somebody has to do it. If nobody does, everybody pays the last person who did.</h1>
            <noscript><p class="boot-note">This page needs JavaScript: the game runs in your browser.</p></noscript>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
