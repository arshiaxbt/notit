<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffd60a" />
    <meta name="robots" content="noindex" />
    <title>Not It — nothing here</title>
    <link rel="icon" type="image/svg+xml" href="/notit/favicon.svg" />
    <style>
      html { background: #f4f2ec; color: #16130c; }
      body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .ribbon { margin: 0; padding: 5px 12px; background: #16130c; color: #fff4d6; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.09em; line-height: 17px; text-align: center; text-transform: uppercase; }
      .bar { box-sizing: border-box; max-width: 1180px; min-height: 70px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; }
      .logo { display: inline-flex; align-items: center; gap: 8px; color: inherit; font-size: 1.6rem; font-weight: 800; line-height: 1; letter-spacing: -0.03em; text-decoration: none; }
      .logo span:last-child { padding: 4px 8px; background: #ffd60a; color: #16130c; border: 3px solid #16130c; border-radius: 12px; transform: rotate(-5deg); }
      .stage { min-height: calc(100vh - 97px); box-sizing: border-box; padding: 56px 16px; background: #ffd60a; color: #16130c; text-align: center; }
      .face { width: 96px; height: 96px; margin: 0 auto 24px; position: relative; background: #fffdf5; border: 3px solid #16130c; border-radius: 50%; }
      .face i { position: absolute; top: 34px; width: 14px; height: 14px; background: #16130c; border-radius: 50%; }
      .face i:first-child { left: 14px; } .face i:last-child { left: 42px; }
      h1 { margin: 0 0 12px; font-size: 1.6rem; font-weight: 800; }
      a.home { display: inline-block; padding: 13px 0; color: inherit; font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
      @media (prefers-color-scheme: dark) { html { background: #14120d; color: #fff4d6; } }
    </style>
  </head>
  <body>
    <p class="ribbon">no value</p>
    <div class="bar"><a class="logo" href="/notit/" aria-label="Not It"><span>Not</span><span>it!</span></a></div>
    <main class="stage">
      <div class="face" aria-hidden="true"><i></i><i></i></div>
      <h1>Nothing here.</h1>
      <a class="home" href="/notit/">Back to the game</a>
    </main>
  </body>
</html>
