[package]
name = "notit"
description = "Not It ($NOTIT): a volunteer's-dilemma memecoin. Every round somebody has to burn to save everyone."
version = "1.0.0"
edition = "2024"
resolver = "3"
rust-version = "1.95"
license = "MIT"
# The link is embedded in the compiled contract (NEP-330 `contract_source_metadata`).
repository = "https://github.com/arshiaxbt/notit"

[lib]
crate-type = ["cdylib", "rlib"]

# fields to configure build with WASM reproducibility, according to specs
# in https://github.com/near/NEPs/blob/master/neps/nep-0330.md
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-sdk = "5.30.1"
primitive-types = { version = "0.12", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-sandbox = "0.4.0"
near-api = "0.8"
cargo-near-build = "0.11.0"
tokio = { version = "1.12.0", features = ["full"] }
testresult = "0.4.1"
serde_json = "1"

# No debug info in test builds: a third of the disk space and faster links.
[profile.dev]
debug = false

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
